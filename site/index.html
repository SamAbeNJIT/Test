<title>Postline Signs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: retail storefront — slim promo bar, sticky header, one view at a time (home → product → upload → checkout → proof). Signal-yellow is reserved for the one primary action per screen. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#14213D; --muted:#596379; --line:#DCE1EA;
  --accent:#FFC72C; --accent-ink:#14213D; --brand:#1F4FD8; --ok:#1B8754; --ok-bg:#E6F4EC; --warn:#A45A00; --warn-bg:#FFF3DD;
  --sign-face:#FFFFFF; --glass:#CFE0EE; --metal:#B9C1CC; --stake:#7C8696;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#161D2E; --ink:#E8ECF4; --muted:#9BA5B9; --line:#2A3347;
  --accent:#FFC72C; --accent-ink:#14213D; --brand:#86A8FF; --ok:#4CC38A; --ok-bg:#12301F; --warn:#FFB54A; --warn-bg:#33260F;
  --sign-face:#F4F6FA; --glass:#2A4157; --metal:#5D6878; --stake:#6D7787; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161D2E; --ink:#E8ECF4; --muted:#9BA5B9; --line:#2A3347;
  --accent:#FFC72C; --accent-ink:#14213D; --brand:#86A8FF; --ok:#4CC38A; --ok-bg:#12301F; --warn:#FFB54A; --warn-bg:#33260F;
  --sign-face:#F4F6FA; --glass:#2A4157; --metal:#5D6878; --stake:#6D7787; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0}
h1,h2,h3{font-family:var(--display);font-stretch:85%;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:850}
h2{font-size:clamp(1.5rem,3vw,2rem);font-weight:800}
h3{font-size:1.15rem;font-weight:750}
p{margin:0}
a{color:var(--brand)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font:700 .75rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* promo bar + header */
.promo{background:var(--ink);color:var(--bg);font-size:.85rem;font-weight:600;text-align:center;padding:8px 16px}
.promo span{opacity:.6;padding-inline:8px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font:900 1.35rem/1 var(--display);font-stretch:75%;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;background:none;border:0;padding:0}
.logo i{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--accent);color:var(--accent-ink);border-radius:6px;font-style:normal;font-size:1rem;transform:rotate(-6deg)}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--ink)}
nav.main button:hover{background:var(--bg)}
.cartbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line)!important}
.cartbtn b{background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:.8rem}
@media (max-width:640px){nav.main .hide-sm{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);padding:14px 22px;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;transition:transform .08s ease, filter .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* stars / trust */
.stars{color:#E8A400;letter-spacing:1px}
.trust{display:flex;flex-wrap:wrap;gap:8px 20px;font-weight:600;font-size:.9rem}
.trust span::before{content:"✓ ";color:var(--ok)}

/* home */
.hero{padding-block:48px 40px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero-copy{display:grid;gap:18px;min-width:0}
.hero-copy .lede{font-size:1.15rem;color:var(--muted);max-width:44ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}}
section.block{padding-block:40px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.grid-products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.grid-products{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.grid-products{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;text-align:left;cursor:pointer;transition:border-color .15s, transform .15s}
.pcard:hover{border-color:var(--ink);transform:translateY(-2px)}
.pcard .thumb{background:var(--bg);border-radius:10px;height:170px;display:grid;place-items:center;overflow:hidden}
.pcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .from{font-weight:700}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.steps{grid-template-columns:1fr}}
.step{display:grid;gap:6px;align-content:start}
.step::before{counter-increment:s;content:counter(s);font:900 1.1rem/1 var(--display);width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--bg);margin-bottom:6px}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.reviews{grid-template-columns:1fr}}
.review{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:8px;align-content:start}
.band{background:var(--ink);color:var(--bg);border-radius:16px;padding:28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.band .muted{color:inherit;opacity:.75}
@media (max-width:700px){.band{grid-template-columns:1fr}}

/* product page */
.crumbs{font-size:.875rem;padding-block:18px 8px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;font-weight:600}
.pdp{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:start;padding-bottom:40px}
@media (max-width:860px){.pdp{grid-template-columns:1fr}}
.stage{position:sticky;top:84px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:14px;min-width:0}
@media (max-width:860px){.stage{position:static}}
.stage-canvas{background:var(--bg);border-radius:12px;min-height:340px;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px}
.stage-cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.875rem;color:var(--muted)}
.config{display:grid;gap:22px;min-width:0}
.config fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
.config legend{font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;width:100%}
.opt{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt input{accent-color:var(--ink);margin:0;width:18px;height:18px}
.opt .price{font-weight:700;text-align:right}
.save{font-size:.75rem;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:2px 8px;white-space:nowrap}
.save.none{visibility:hidden}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.summary .total{display:flex;justify-content:space-between;align-items:baseline}
.summary .total strong{font:850 1.9rem/1 var(--display);font-stretch:85%}
.ship-line{display:flex;gap:10px;align-items:center;font-size:.9rem;font-weight:600}
.ship-line .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
details.faq{border-bottom:1px solid var(--line);padding-block:14px}
details.faq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";font-weight:800}
details.faq[open] summary::after{content:"–"}
details.faq p{margin-top:8px;color:var(--muted);max-width:65ch}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;font-size:.9rem}
.facts div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-block:6px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600;text-align:right}
@media (max-width:520px){.facts{grid-template-columns:1fr}}

/* stepper */
.stepper{display:flex;gap:6px;flex-wrap:wrap;padding-block:20px 6px;list-style:none;margin:0;padding-inline:0}
.stepper li{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:var(--muted)}
.stepper li::after{content:"";width:28px;height:2px;background:var(--line)}
.stepper li:last-child::after{display:none}
.stepper .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:.75rem}
.stepper .done{color:var(--ink)} .stepper .done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper .cur{color:var(--ink)} .stepper .cur .n{border-color:var(--ink);background:var(--ink);color:var(--bg)}

/* upload */
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:start;padding-block:16px 48px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:16px;min-width:0}
.drop{border:2px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;display:grid;gap:10px;justify-items:center;cursor:pointer;transition:border-color .15s, background .15s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--bg)}
.drop .big{font:800 1.2rem/1.2 var(--display);font-stretch:90%}
.filechip{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.filechip img{width:44px;height:44px;object-fit:contain;background:var(--bg);border-radius:6px}
.filechip .name{font-weight:600;overflow-wrap:anywhere;min-width:0;flex:1}
label.f{display:grid;gap:6px;font-weight:600;font-size:.9rem}
input.t,textarea.t,select.t{border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--surface);width:100%;font-weight:400}
input.t:focus,textarea.t:focus{border-color:var(--ink);outline:none}
input.t.bad{border-color:#D23B3B}
.err{color:#D23B3B;font-size:.8rem;font-weight:600}
.callout{background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:.9rem}
.callout.ok{background:var(--ok-bg)}

/* checkout */
.co{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start;padding-block:16px 48px}
@media (max-width:860px){.co{grid-template-columns:1fr}}
.co form{display:grid;gap:18px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}
.express{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.express button{border-radius:9px;padding:12px;font-weight:700;border:0;cursor:pointer;background:var(--ink);color:var(--bg)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.side{position:sticky;top:84px}
@media (max-width:860px){.side{position:static}}
.line-item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:start;padding-block:12px;border-bottom:1px solid var(--line)}
.line-item .mini{background:var(--bg);border-radius:8px;height:72px;display:grid;place-items:center;overflow:hidden;padding:6px}
.line-item .acts{display:flex;gap:14px;font-size:.85rem}
.totals{display:grid;gap:6px;padding-top:12px}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-weight:800;font-size:1.2rem;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.free{color:var(--ok);font-weight:700}

/* confirmation timeline */
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:28px 1fr;gap:14px;padding-bottom:20px;position:relative}
.timeline li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .b{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.timeline .is-done .b{background:var(--ok);border-color:var(--ok);color:#fff}
.timeline .is-now .b{border-color:var(--ink);background:var(--accent);color:var(--accent-ink)}

/* proof */
.proofsheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:16px;min-width:0}
.proof-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.pill{font-size:.75rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:4px 10px;background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.dim{display:grid;width:100%;grid-template-columns:auto minmax(0,1fr);gap:0;align-items:center}
.dim .h{grid-column:2;text-align:center;font-size:.8rem;font-weight:700;color:var(--muted);border-top:1.5px solid var(--muted);margin-top:8px;padding-top:4px}
.dim .v{grid-row:1;writing-mode:vertical-rl;transform:rotate(180deg);font-size:.8rem;font-weight:700;color:var(--muted);border-right:1.5px solid var(--muted);margin-right:8px;padding-right:4px;text-align:center}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:.9rem}
.checks li::before{content:"✓";color:var(--ok);font-weight:800;margin-right:8px}
.confirm-box{border:1.5px solid var(--ink);border-radius:12px;padding:16px;display:grid;gap:12px}
.history{font-size:.85rem;display:grid;gap:8px}
.history div{border-left:3px solid var(--line);padding-left:10px}

/* sign mockups (pure CSS) */
.sign{position:relative;display:grid;place-items:center;width:100%;min-width:0}
.stage-canvas>*,.dim>*{min-width:0;max-width:100%}
.sign .face{background:var(--sign-face);box-shadow:0 10px 24px rgba(10,20,40,.18);display:grid;place-items:center;overflow:hidden;position:relative;max-width:100%}
.sign .face img{width:100%;height:100%;object-fit:contain;display:block}
.sign.yard .face{border-radius:3px;border:1px solid rgba(0,0,0,.08)}
.sign.yard::after{content:"";width:62%;height:36px;border:4px solid var(--stake);border-top:0;border-bottom:0;margin-top:-2px}
.sign.banner .face{border-radius:2px}
.sign.banner .face::before,.sign.banner .face::after{content:"";position:absolute;top:6px;width:9px;height:9px;border-radius:50%;background:var(--metal);box-shadow:0 0 0 2px #fff inset}
.sign.banner .face::before{left:6px}.sign.banner .face::after{right:6px}
.sign.aluminum .face{border-radius:10px;border:5px solid var(--metal)}
.sign.acrylic .face{border-radius:6px;border:6px solid rgba(160,200,230,.55);box-shadow:0 14px 30px rgba(10,20,40,.22), inset 0 0 0 1px rgba(255,255,255,.6)}
.sign.acrylic .face::before,.sign.acrylic .face::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(#fff,var(--metal));top:8px}
.sign.acrylic .face::before{left:8px}.sign.acrylic .face::after{right:8px}
.sign.aframe{padding:0 14px}
.sign.aframe .face{border:8px solid #2B2F36;border-radius:4px}
.sign.aframe::after{content:"";width:calc(100% + 0px);height:22px;border-left:8px solid #2B2F36;border-right:8px solid #2B2F36;margin-top:-2px}
.sign.decal{background:var(--glass);padding:22px;border-radius:6px;border:8px solid var(--metal)}
.sign.decal .face{background:transparent;box-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}

footer.foot{border-top:1px solid var(--line);margin-top:24px;padding-block:28px;font-size:.875rem;color:var(--muted)}
footer.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.view{animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.pcard,.btn{transition:none}}
</style>

<div class="promo">Free shipping on every order<span>•</span>Free online proofs<span>•</span>Printed in 4 days</div>
<header class="top">
  <div class="wrap">
    <button class="logo" data-go="home" aria-label="Postline Signs home"><i>P</i>Postline</button>
    <nav class="main" aria-label="Main">
      <button data-go="home" data-scroll="products" class="hide-sm">Products</button>
      <button data-go="product" data-p="yard" data-qty="1" class="hide-sm">Try 1 sign</button>
      <button data-go="home" data-scroll="reviews" class="hide-sm">Reviews</button>
      <button class="cartbtn" data-go="checkout" aria-label="Cart">Cart <b id="cartCount">0</b></button>
    </nav>
  </div>
</header>
<main id="app"></main>
<footer class="foot"><div class="wrap"><span>Postline Signs is a fictional company. Demo storefront for a UX class project, modeled on Sticker Mule's ordering flow.</span><span>Help: hello@postline.example</span></div></footer>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
/* ---------- data ---------- */
const QTY=[1,5,10,25,50,100];
const DISC={1:1,5:.82,10:.7,25:.58,50:.5,100:.42};
const PRODUCTS={
  yard:{name:"Yard signs",kind:"yard",blurb:"Corrugated plastic signs with optional H-stakes. Built for elections, open houses and job sites.",
    material:"4mm corrugated plastic",print:"Full color, 1 or 2 sided",use:"Outdoor, 1–2 years",
    sizes:[["18 × 12 in",18,12,14],["24 × 18 in",24,18,19],["36 × 24 in",36,24,29]],addon:{label:"Add H-stakes",price:2}},
  banners:{name:"Vinyl banners",kind:"banner",blurb:"13 oz scrim vinyl with hemmed edges and grommets every 2 ft. Hangs anywhere.",
    material:"13 oz scrim vinyl",print:"Full color, UV-resistant ink",use:"Outdoor, 3+ years",
    sizes:[["4 × 2 ft",48,24,39],["6 × 3 ft",72,36,69],["8 × 4 ft",96,48,109]]},
  aluminum:{name:"Aluminum signs",kind:"aluminum",blurb:"Rust-proof .040 aluminum with rounded corners and pre-drilled holes. Parking, safety and storefront.",
    material:".040 aluminum",print:"Full color, laminated",use:"Outdoor, 7+ years",
    sizes:[["18 × 12 in",18,12,29],["24 × 18 in",24,18,45],["36 × 24 in",36,24,79]]},
  acrylic:{name:"Acrylic signs",kind:"acrylic",blurb:"Clear 1/4 in acrylic with brushed standoffs. Lobby and office signs that look expensive.",
    material:'1/4" clear acrylic',print:"Reverse-printed, white backer",use:"Indoor",
    sizes:[["12 × 12 in",12,12,59],["24 × 18 in",24,18,99],["36 × 24 in",36,24,169]]},
  aframe:{name:"A-frame signs",kind:"aframe",blurb:"Folding sidewalk sign with two printed inserts. Swap the inserts any time.",
    material:"Steel frame + coroplast inserts",print:"Full color, both sides",use:"Outdoor, daily use",
    sizes:[["24 × 36 in",24,36,149]]},
  decals:{name:"Window decals",kind:"decal",blurb:"Removable vinyl for glass. Hours, logos and sale signage with no residue.",

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money2=n=>"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>money2(n).replace(/\.00$/,"");
function unit(pid,size,qty){return PRODUCTS[pid].sizes[size][3]*DISC[qty]}
function lineTotal(i){return (unit(i.pid,i.size,i.qty)+(i.addon?PRODUCTS[i.pid].addon.price:0))*i.qty}
function bizDays(n){const d=new Date();let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w&&w<6)k++}return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
function fromPrice(pid){const p=PRODUCTS[pid];return p.sizes[0][3]*DISC[100]}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

function mock(pid,size,art,maxW=300,maxH=260){
  const p=PRODUCTS[pid],[,w,h]=p.sizes[size];const r=Math.min(maxW/w,maxH/h);

  return `<div class="sign ${p.kind}"><div class="face" style="width:min(${W}px,100%);aspect-ratio:${w}/${h}"><img alt="Your artwork on a ${esc(p.sizes[size][0])} ${esc(p.name.toLowerCase())}" src="${art||SAMPLE_ART}"></div></div>`;
}
function stepper(cur){
  const steps=["Choose options","Upload artwork","Checkout","Approve proof"];
  return `<ol class="stepper" aria-label="Order progress">${steps.map((s,i)=>`<li class="${i<cur?"done":i===cur?"cur":""}" ${i===cur?'aria-current="step"':""}><span class="n">${i<cur?"✓":i+1}</span>${s}</li>`).join("")}</ol>`;
}

function stay(){const y=window.scrollY;render();window.scrollTo(0,y)}
function render(scrollTo){
  $("#app").innerHTML=`<div class="view">${V[S.view]()}</div>`;
  $("#cartCount").textContent=S.cart.length;
  if(scrollTo){const el=document.getElementById(scrollTo);if(el){el.scrollIntoView({behavior:"smooth"});return}}
  window.scrollTo(0,0);
}
function go(view,opts={}){
  if(view==="product"&&opts.p&&opts.p!==S.pid){S.pid=opts.p;S.size=Math.min(1,PRODUCTS[S.pid].sizes.length-1);S.addon=false;S.art=null;S.artName="";S.notes="";S.editIx=null}
  if(opts.qty)S.qty=+opts.qty;
  if((view==="proof"||view==="confirm")&&!S.order)view="home";
  S.view=view;render(opts.scroll);
}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){e.preventDefault();go(g.dataset.go,{p:g.dataset.p,scroll:g.dataset.scroll,qty:g.dataset.qty});return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="continue"){go("upload")}
  else if(act==="clearfile"){e.preventDefault();S.art=null;S.artName="";stay()}
  else if(act==="addcart"){
    const n=$("#notes");if(n)S.notes=n.value;
    const item={pid:S.pid,size:S.size,qty:S.qty,addon:S.addon,art:S.art,artName:S.artName,notes:S.notes};
    if(S.editIx!=null&&S.cart[S.editIx]){S.cart[S.editIx]=item;S.editIx=null}else S.cart.push(item);
    saveCart();go("checkout");toast("Added to cart");
  }
  else if(act==="remove"){S.cart.splice(+a.dataset.ix,1);saveCart();render();toast("Removed from cart")}
  else if(act==="edit"){const i=S.cart[+a.dataset.ix];Object.assign(S,{pid:i.pid,size:i.size,qty:i.qty,addon:i.addon,art:i.art,artName:i.artName,notes:i.notes||"",editIx:+a.dataset.ix});S.view="product";render()}
  else if(act==="express"){toast("Demo: express pay would open here. Use the card form below.")}
  else if(act==="fill"){const v={email:"sam@mapleteam.example",phone:"555-0142",name:"Sam Rivera",addr:"412 Maple Ave",city:"Columbus",state:"OH",zip:"43215",card:"4242 4242 4242 4242",exp:"12 / 28",cvc:"123"};for(const k in v){const el=document.getElementById(k);if(el){el.value=v[k];el.classList.remove("bad")}}document.querySelectorAll(".co .err").forEach(x=>x.remove())}
  else if(act==="openproof"){S.proof={status:"ready",version:1,history:["v1 sent by Jordan (prepress): added bleed, centered artwork."],confirming:false,changing:false};go("proof")}
  else if(act==="confirmapprove"){S.proof.confirming=true;stay()}
  else if(act==="cancelconfirm"){S.proof.confirming=false;stay()}
  else if(act==="approve"){S.proof.status="approved";S.proof.confirming=false;S.proof.history.push(`You approved v${S.proof.version}. Production started.`);render();toast("Proof approved")}
  else if(act==="requestchange"){S.proof.changing=true;render();$("#change").focus()}
  else if(act==="cancelchange"){S.proof.changing=false;stay()}
  else if(act==="sendchange"){const t=$("#change").value.trim();if(!t){$("#changeErr").hidden=false;$("#change").focus();return}S.proof.history.push(`You asked: "${t}"`);S.proof.status="revising";S.proof.changing=false;render();toast("Change request sent")}
  else if(act==="newversion"){S.proof.version++;S.proof.status="ready";S.proof.history.push(`v${S.proof.version} sent by Jordan (prepress): change applied.`);render()}
});

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.name==="size"){S.size=+t.value;stay();document.getElementById("size-"+S.size).focus({preventScroll:true})}
  else if(t.name==="qty"){S.qty=+t.value;stay();document.getElementById("qty-"+S.qty).focus({preventScroll:true})}
  else if(t.id==="addon"){S.addon=t.checked;stay();$("#addon").focus({preventScroll:true})}
  else if(t.id==="file"&&t.files[0])readFile(t.files[0]);
});
document.addEventListener("input",e=>{if(e.target.id==="notes")S.notes=e.target.value});

function readFile(f){
  const n=$("#notes");if(n)S.notes=n.value;
  S.artName=f.name;S.art=null;
  if(/^image\//.test(f.type)&&f.size<15e6){const r=new FileReader();r.onload=()=>{S.art=r.result;stay()};r.readAsDataURL(f)}else render();
}
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0])}});

document.addEventListener("submit",e=>{
  if(e.target.id!=="coForm")return;e.preventDefault();
  const f=e.target;f.querySelectorAll(".err").forEach(x=>x.remove());let first=null;
  const msgs={email:"Enter an email so we can send your proof.",name:"Enter the name for the shipping label.",addr:"Enter a street address.",city:"Enter a city.",state:"Enter a state.",zip:"Enter a 5-digit ZIP.",card:"Enter a card number.",exp:"Enter the expiry date.",cvc:"Enter the 3-digit code."};
  for(const id in msgs){const el=document.getElementById(id);let ok=el.value.trim()!=="";
    if(id==="email")ok=/^\S+@\S+\.\S+$/.test(el.value.trim());
    if(id==="zip")ok=/^\d{5}$/.test(el.value.trim());
    el.classList.toggle("bad",!ok);
    if(!ok){const s=document.createElement("span");s.className="err";s.textContent=msgs[id];el.after(s);first=first||el}}
  if(first){first.focus();return}
  const total=S.cart.reduce((a,i)=>a+lineTotal(i),0);
  S.order={id:"PL-"+(48000+Math.floor(Math.random()*999)),first:$("#name").value.trim().split(" ")[0],email:$("#email").value.trim(),phone:$("#phone").value.trim(),items:S.cart.slice(),total,eta:bizDays(6)};
  S.cart=[];saveCart();go("confirm");
});

render();
})();
</script>
